<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisar</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="pesquisar">
    <header class="page-header">
        <div class="page-header-inner">
            <button class="btn btn--icon" id="backTop" aria-label="Voltar"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-arrow-left"/></svg></button>
            <h1 class="page-title">Pesquisar</h1>
            <button class="btn btn--icon" data-logout aria-label="Sair"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-sign-out"/></svg></button>
        </div>
    </header>
    <main id="app" class="page">
        <div class="search-field">
            <span class="search-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-magnifying-glass"/></svg></span>
            <label class="sr-only" for="searchInput">Digite nome ou CPF</label>
            <input class="field" id="searchInput" type="search" placeholder="Digite nome ou CPF" autocomplete="off">
        </div>
        <button class="btn btn--primary btn--block no-print" id="searchBtn">Pesquisar</button>
        <div id="searchResult" class="participante-list stack-gap"></div>
    </main>
    <nav class="bottom-nav" aria-label="Navegação principal">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item" data-nav="dashboard.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-house"/></svg></span><span>Início</span></button>
            <button class="bottom-nav-item" data-nav="caravanas.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-bus"/></svg></span><span>Caravanas</span></button>
            <button class="bottom-nav-item" data-nav="participantes.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-users"/></svg></span><span>Participantes</span></button>
            <button class="bottom-nav-item is-active" data-nav="pesquisar-participante.html" aria-current="page"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-dots-three"/></svg></span><span>Mais</span></button>
        </div>
    </nav>
    <div class="modal-overlay" id="confirmOverlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <h2 id="confirmTitle">Confirmar</h2>
            <p id="confirmDescription"></p>
            <div class="modal-actions">
                <button class="btn btn--secondary" id="confirmCancel">Cancelar</button>
                <button class="btn btn--danger" id="confirmOk">Confirmar</button>
            </div>
        </div>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/caravanas.js"></script>
    <script src="../js/participantes.js"></script>
    <script src="../js/associacoes.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.getElementById('backTop').addEventListener('click', function () { navigateTo('dashboard.html'); });
    </script>
</body>
</html>
