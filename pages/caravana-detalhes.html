<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caravana</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="caravana-detalhes">
    <header class="page-header">
        <div class="page-header-inner">
            <button class="btn btn--icon" id="backBtn" aria-label="Voltar"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-arrow-left"/></svg></button>
            <h1 class="page-title">Caravana</h1>
            <button class="btn btn--icon" id="menuBtn" aria-label="Ações da caravana"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-dots-three"/></svg></button>
        </div>
    </header>
    <main id="app" class="page">
        <section class="card" aria-label="Resumo da caravana">
            <div class="detail-head">
                <span class="avatar avatar-lg" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-bus"/></svg></span>
                <div class="detail-head-body">
                    <h2 id="detailRoute">—</h2>
                    <p class="page-subtitle" id="detailMeta">—</p>
                    <p class="page-subtitle" id="detailResp">—</p>
                </div>
                <button class="btn btn--icon" id="editCaravana" aria-label="Editar caravana"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-pencil-simple"/></svg></button>
            </div>
        </section>

        <div class="nav-list tabs" role="tablist">
            <button class="nav-item tab-btn is-active" id="tabParticipantes" role="tab">Participantes</button>
            <button class="nav-item tab-btn" id="tabInformacoes" role="tab">Informações</button>
        </div>

        <section id="panelParticipantes">
            <h3 id="partCount">Participantes (0)</h3>
            <div class="search-field stack-gap">
                <span class="search-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-magnifying-glass"/></svg></span>
                <label class="sr-only" for="searchDetalhe">Pesquisar nesta caravana</label>
                <input class="field" id="searchDetalhe" type="search" placeholder="Pesquisar nesta caravana" autocomplete="off">
            </div>
            <div id="detalheList" class="participante-list"></div>
            <div class="form-actions no-print">
                <button class="btn btn--secondary" id="assocBtn">Associar</button>
                <button class="btn btn--primary" id="listaBtn">Gerar lista de participantes</button>
            </div>
        </section>

        <section id="panelInformacoes" hidden>
            <div class="card">
                <p><strong>Origem:</strong> <span id="infoOrigem">—</span></p>
                <p><strong>Destino:</strong> <span id="infoDestino">—</span></p>
                <p><strong>Data:</strong> <span id="infoData">—</span></p>
                <p><strong>Horário:</strong> <span id="infoHorario">—</span></p>
                <p><strong>Responsável:</strong> <span id="infoResp">—</span></p>
            </div>
        </section>
    </main>
    <nav class="bottom-nav" aria-label="Navegação principal">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item" data-nav="dashboard.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-house"/></svg></span><span>Início</span></button>
            <button class="bottom-nav-item is-active" data-nav="caravanas.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-bus"/></svg></span><span>Caravanas</span></button>
            <button class="bottom-nav-item" data-nav="participantes.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-users"/></svg></span><span>Participantes</span></button>
            <button class="bottom-nav-item" data-nav="pesquisar-participante.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-dots-three"/></svg></span><span>Mais</span></button>
        </div>
    </nav>
    <div class="modal-overlay" id="confirmOverlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <h2 id="confirmTitle">Confirmar</h2>
            <p id="confirmDescription"></p>
            <div class="modal-actions">
                <button class="btn btn--secondary" id="confirmCancel">Cancelar</button>
                <button class="btn btn--danger" id="confirmOk">Excluir</button>
            </div>
        </div>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/caravanas.js"></script>
    <script src="../js/participantes.js"></script>
    <script src="../js/associacoes.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
