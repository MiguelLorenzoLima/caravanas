<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caravana</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="caravana-detalhes">
    <header class="page-header">
        <div class="page-header-inner">
            <button class="icon-button" id="backBtn" aria-label="Voltar">←</button>
            <h1 class="page-title">Caravana</h1>
            <button class="icon-button" id="menuBtn" aria-label="Ações da caravana">⋯</button>
        </div>
    </header>
    <main id="app" class="page">
        <section class="card" aria-label="Resumo da caravana">
            <div style="display:flex; gap:12px; align-items:center;">
                <span class="avatar avatar-lg" aria-hidden="true">🚌</span>
                <div style="flex:1;">
                    <h2 id="detailRoute">—</h2>
                    <p class="page-subtitle" id="detailMeta" style="margin:0;">—</p>
                    <p class="page-subtitle" id="detailResp" style="margin:0;">—</p>
                </div>
                <button class="btn-icon" id="editCaravana" aria-label="Editar caravana">✏️</button>
            </div>
        </section>

        <div class="tabs" role="tablist">
            <button class="tab-btn active" id="tabParticipantes" role="tab">Participantes</button>
            <button class="tab-btn" id="tabInformacoes" role="tab">Informações</button>
        </div>

        <section id="panelParticipantes">
            <h3 id="partCount">Participantes (0)</h3>
            <div class="search-field" style="margin-top:12px;">
                <span class="search-icon" aria-hidden="true">🔍</span>
                <label class="sr-only" for="searchDetalhe">Pesquisar nesta caravana</label>
                <input class="form-input" id="searchDetalhe" type="search" placeholder="Pesquisar nesta caravana" autocomplete="off">
            </div>
            <div id="detalheList" class="participante-list"></div>
            <div class="form-actions no-print">
                <button class="btn btn-secondary" id="assocBtn">Associar</button>
                <button class="btn btn-primary" id="listaBtn">Gerar lista de participantes</button>
            </div>
        </section>

        <section id="panelInformacoes" hidden>
            <div class="card">
                <p><strong>Origem:</strong> <span id="infoOrigem">—</span></p>
                <p><strong>Destino:</strong> <span id="infoDestino">—</span></p>
                <p><strong>Data:</strong> <span id="infoData">—</span></p>
                <p><strong>Horário:</strong> <span id="infoHorario">—</span></p>
                <p><strong>Responsável:</strong> <span id="infoResp">—</span></p>
            </div>
        </section>
    </main>
    <nav class="bottom-nav" aria-label="Navegação principal">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item" data-nav="dashboard.html"><span class="bottom-nav-icon" aria-hidden="true">🏠</span><span>Início</span></button>
            <button class="bottom-nav-item active" data-nav="caravanas.html"><span class="bottom-nav-icon" aria-hidden="true">🚌</span><span>Caravanas</span></button>
            <button class="bottom-nav-item" data-nav="participantes.html"><span class="bottom-nav-icon" aria-hidden="true">👥</span><span>Participantes</span></button>
            <button class="bottom-nav-item" data-nav="pesquisar-participante.html"><span class="bottom-nav-icon" aria-hidden="true">⋯</span><span>Mais</span></button>
        </div>
    </nav>
    <div class="modal-overlay" id="confirmOverlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <h2 id="confirmTitle">Confirmar</h2>
            <p id="confirmDescription"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="confirmCancel">Cancelar</button>
                <button class="btn btn-danger" id="confirmOk">Excluir</button>
            </div>
        </div>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/caravanas.js"></script>
    <script src="../js/participantes.js"></script>
    <script src="../js/associacoes.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
