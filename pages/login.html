<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caravanas — Entrar</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="login">
    <main id="app" class="login-page">
        <div class="card login-card form-box">
            <div class="login-logo" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-bus"/></svg></div>
            <span class="eyebrow">Bem-vindo</span>
            <h1 class="login-title">Caravanas</h1>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="label" for="usuario">Usuário</label>
                    <input class="field" id="usuario" name="usuario" type="text" placeholder="Digite seu usuário" autocomplete="username">
                    <span class="form-error" id="usuarioError"></span>
                </div>
                <div class="form-group">
                    <label class="label" for="senha">Senha</label>
                    <div class="password-wrap">
                        <input class="field" id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password">
                        <button type="button" class="password-toggle" id="toggleSenha" aria-label="Mostrar senha"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-eye"/></svg></button>
                    </div>
                    <span class="form-error" id="senhaError"></span>
                </div>
                <button class="btn btn--primary btn--block" type="submit">Entrar</button>
                <p class="login-link">
                    <a href="#" id="forgotLink">Esqueceu a senha?</a>
                </p>
            </form>
        </div>
    </main>
    <script src="../js/storage.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/caravanas.js"></script>
    <script src="../js/participantes.js"></script>
    <script src="../js/associacoes.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.getElementById('forgotLink').addEventListener('click', function (e) {
            e.preventDefault();
            showToast('Fale com o responsável para redefinir a senha.', 'info');
        });
    </script>
</body>
</html>
