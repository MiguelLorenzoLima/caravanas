<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Associar Participante</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="associar">
    <header class="page-header">
        <div class="page-header-inner">
            <button class="btn btn--icon" id="backTop" aria-label="Voltar">←</button>
            <h1 class="page-title">Associar Participante</h1>
            <span class="header-spacer"></span>
        </div>
    </header>
    <main id="app" class="page">
        <div class="form-group">
            <label class="label" for="caravanaSelect">Caravana</label>
            <select class="select" id="caravanaSelect"></select>
        </div>
        <div class="search-field">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <label class="sr-only" for="searchDisponiveis">Pesquisar participantes</label>
            <input class="field" id="searchDisponiveis" type="search" placeholder="Pesquisar participantes" autocomplete="off">
        </div>
        <h2 class="section-title">Disponíveis</h2>
        <div id="disponiveisList" class="participante-list stack-gap"></div>
        <h2 class="section-title" id="addedCount">Participantes adicionados (0)</h2>
        <div id="adicionadosList" class="participante-list stack-gap"></div>
        <div class="form-actions">
            <button class="btn btn--secondary" id="cancelAssoc">Cancelar</button>
            <button class="btn btn--primary" id="saveAssoc">Salvar</button>
        </div>
    </main>
    <nav class="bottom-nav" aria-label="Navegação principal">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item" data-nav="dashboard.html"><span class="bottom-nav-icon" aria-hidden="true">🏠</span><span>Início</span></button>
            <button class="bottom-nav-item" data-nav="caravanas.html"><span class="bottom-nav-icon" aria-hidden="true">🚌</span><span>Caravanas</span></button>
            <button class="bottom-nav-item" data-nav="participantes.html"><span class="bottom-nav-icon" aria-hidden="true">👥</span><span>Participantes</span></button>
            <button class="bottom-nav-item" data-nav="pesquisar-participante.html"><span class="bottom-nav-icon" aria-hidden="true">⋯</span><span>Mais</span></button>
        </div>
    </nav>
    <script src="../js/storage.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/caravanas.js"></script>
    <script src="../js/participantes.js"></script>
    <script src="../js/associacoes.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.getElementById('backTop').addEventListener('click', function () { goBack('caravanas.html'); });
    </script>
</body>
</html>
