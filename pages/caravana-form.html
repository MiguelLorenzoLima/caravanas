<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Caravana</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="caravana-form">
    <header class="page-header">
        <div class="page-header-inner">
            <button class="btn btn--icon" id="cancelCaravanaTop" aria-label="Voltar"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-arrow-left"/></svg></button>
            <h1 class="page-title" id="formTitle">Nova Caravana</h1>
            <span class="header-spacer"></span>
        </div>
    </header>
    <main id="app" class="page">
        <form id="caravanaForm" class="form-box" novalidate>
            <div class="form-group">
                <label class="label" for="origem">Origem</label>
                <input class="field" id="origem" name="origem" type="text" placeholder="Ex.: Joinville" value="Joinville">
                <span class="form-error" id="origemError"></span>
            </div>
            <div class="form-group">
                <label class="label" for="destino">Destino</label>
                <input class="field" id="destino" name="destino" type="text" placeholder="Ex.: São Paulo">
                <span class="form-error" id="destinoError"></span>
            </div>
            <div class="form-row">
                <div class="form-group form-group--half">
                    <label class="label" for="data">Data da viagem</label>
                    <input class="field" id="data" name="data" type="date">
                    <span class="form-error" id="dataError"></span>
                </div>
                <div class="form-group form-group--half">
                    <label class="label" for="horario">Horário de saída</label>
                    <input class="field" id="horario" name="horario" type="time">
                    <span class="form-error" id="horarioError"></span>
                </div>
            </div>
            <div class="form-group">
                <label class="label" for="responsavel">Responsável</label>
                <input class="field" id="responsavel" name="responsavel" type="text" placeholder="Ex.: Ir. João Silva">
                <span class="form-error" id="responsavelError"></span>
            </div>
            <div class="form-actions">
                <button class="btn btn--secondary" type="button" id="cancelCaravana">Cancelar</button>
                <button class="btn btn--primary" type="submit">Salvar</button>
            </div>
        </form>
    </main>
    <nav class="bottom-nav" aria-label="Navegação principal">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item" data-nav="dashboard.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-house"/></svg></span><span>Início</span></button>
            <button class="bottom-nav-item is-active" data-nav="caravanas.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-bus"/></svg></span><span>Caravanas</span></button>
            <button class="bottom-nav-item" data-nav="participantes.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-users"/></svg></span><span>Participantes</span></button>
            <button class="bottom-nav-item" data-nav="pesquisar-participante.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-dots-three"/></svg></span><span>Mais</span></button>
        </div>
    </nav>
    <script src="../js/storage.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/caravanas.js"></script>
    <script src="../js/participantes.js"></script>
    <script src="../js/associacoes.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.getElementById('cancelCaravanaTop').addEventListener('click', function () { goBack('caravanas.html'); });
    </script>
</body>
</html>
