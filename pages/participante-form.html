<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participante</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="participante-form">
    <header class="page-header">
        <div class="page-header-inner">
            <button class="icon-button" id="backTop" aria-label="Voltar">←</button>
            <h1 class="page-title" id="formTitle">Novo Participante</h1>
            <span style="width:40px;"></span>
        </div>
    </header>
    <main id="app" class="page">
        <form id="participanteForm" novalidate>
            <div class="form-field">
                <label class="form-label" for="nome">Nome completo</label>
                <input class="form-input" id="nome" name="nome" type="text" placeholder="Digite o nome completo" autocomplete="name">
                <span class="form-error" id="nomeError"></span>
            </div>
            <div class="form-field">
                <label class="form-label" for="nascimento">Data de nascimento</label>
                <input class="form-input" id="nascimento" name="nascimento" type="date">
                <span class="form-error" id="nascimentoError"></span>
            </div>
            <div class="form-field">
                <label class="form-label" for="cpf">CPF</label>
                <input class="form-input" id="cpf" name="cpf" type="text" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off">
                <span class="form-error" id="cpfError"></span>
            </div>
            <div class="form-field">
                <label class="form-label" for="orgaoEmissor">Órgão emissor</label>
                <input class="form-input" id="orgaoEmissor" name="orgaoEmissor" type="text" placeholder="Ex.: SSP/SC">
                <span class="form-error" id="orgaoError"></span>
            </div>
            <div class="form-field">
                <label class="form-label" for="telefone">Telefone</label>
                <input class="form-input" id="telefone" name="telefone" type="tel" placeholder="(00) 00000-0000" inputmode="tel" autocomplete="tel">
                <span class="form-error" id="telefoneError"></span>
            </div>
            <div class="form-actions">
                <button class="btn btn-secondary" type="button" id="cancelParticipante">Cancelar</button>
                <button class="btn btn-primary" type="submit">Salvar</button>
            </div>
        </form>
    </main>
    <nav class="bottom-nav" aria-label="Navegação principal">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item" data-nav="dashboard.html"><span class="bottom-nav-icon" aria-hidden="true">🏠</span><span>Início</span></button>
            <button class="bottom-nav-item" data-nav="caravanas.html"><span class="bottom-nav-icon" aria-hidden="true">🚌</span><span>Caravanas</span></button>
            <button class="bottom-nav-item active" data-nav="participantes.html"><span class="bottom-nav-icon" aria-hidden="true">👥</span><span>Participantes</span></button>
            <button class="bottom-nav-item" data-nav="pesquisar-participante.html"><span class="bottom-nav-icon" aria-hidden="true">⋯</span><span>Mais</span></button>
        </div>
    </nav>
    <script src="../js/storage.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/caravanas.js"></script>
    <script src="../js/participantes.js"></script>
    <script src="../js/associacoes.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.getElementById('backTop').addEventListener('click', function () { goBack('participantes.html'); });
    </script>
</body>
</html>
