<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Participantes</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="lista">
    <header class="page-header no-print">
        <div class="page-header-inner">
            <button class="btn btn--icon" id="backBtn" aria-label="Voltar">←</button>
            <h1 class="page-title">Lista de Participantes</h1>
            <span class="header-spacer"></span>
        </div>
    </header>
    <main id="app" class="page">
        <section class="card" aria-label="Caravana">
            <div class="detail-head">
                <span class="avatar avatar-lg" aria-hidden="true">🚌</span>
                <div class="detail-head-body">
                    <h2 id="listaRoute">—</h2>
                    <p class="page-subtitle" id="listaMeta">—</p>
                    <p class="page-subtitle" id="listaResp">—</p>
                </div>
            </div>
        </section>

        <div class="grid-2 summary-row">
            <div class="card summary-card"><strong id="totalNum">0</strong><span>Total de participantes</span></div>
            <div class="card summary-card"><strong id="pagosNum">0</strong><span>Pagos</span></div>
            <div class="card summary-card"><strong id="pendNum">0</strong><span>Pendentes</span></div>
        </div>

        <ol id="listaOl" class="ordered-list"></ol>

        <div class="form-actions no-print">
            <button class="btn btn--secondary" id="shareBtn">Compartilhar</button>
            <button class="btn btn--primary" id="pdfBtn">Exportar PDF</button>
        </div>
    </main>
    <nav class="bottom-nav no-print" aria-label="Navegação principal">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item" data-nav="dashboard.html"><span class="bottom-nav-icon" aria-hidden="true">🏠</span><span>Início</span></button>
            <button class="bottom-nav-item" data-nav="caravanas.html"><span class="bottom-nav-icon" aria-hidden="true">🚌</span><span>Caravanas</span></button>
            <button class="bottom-nav-item" data-nav="participantes.html"><span class="bottom-nav-icon" aria-hidden="true">👥</span><span>Participantes</span></button>
            <button class="bottom-nav-item" data-nav="pesquisar-participante.html"><span class="bottom-nav-icon" aria-hidden="true">⋯</span><span>Mais</span></button>
        </div>
    </nav>
    <script src="../js/storage.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/caravanas.js"></script>
    <script src="../js/participantes.js"></script>
    <script src="../js/associacoes.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
