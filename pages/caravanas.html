<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caravanas</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="caravanas">
    <header class="page-header">
        <div class="page-header-inner">
            <button class="btn btn--icon" id="backBtn" aria-label="Voltar">←</button>
            <h1 class="page-title">Caravanas</h1>
            <button class="btn btn--icon" id="addCaravana" aria-label="Adicionar caravana">+</button>
        </div>
    </header>
    <main id="app" class="page">
        <div class="search-field">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <label class="sr-only" for="searchCaravanas">Pesquisar caravanas</label>
            <input class="field" id="searchCaravanas" type="search" placeholder="Pesquisar caravanas" autocomplete="off">
        </div>
        <div id="caravanaList" class="caravana-list"></div>
    </main>
    <nav class="bottom-nav" aria-label="Navegação principal">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item" data-nav="dashboard.html"><span class="bottom-nav-icon" aria-hidden="true">🏠</span><span>Início</span></button>
            <button class="bottom-nav-item is-active" data-nav="caravanas.html" aria-current="page"><span class="bottom-nav-icon" aria-hidden="true">🚌</span><span>Caravanas</span></button>
            <button class="bottom-nav-item" data-nav="participantes.html"><span class="bottom-nav-icon" aria-hidden="true">👥</span><span>Participantes</span></button>
            <button class="bottom-nav-item" data-nav="pesquisar-participante.html"><span class="bottom-nav-icon" aria-hidden="true">⋯</span><span>Mais</span></button>
        </div>
    </nav>
    <div class="modal-overlay" id="confirmOverlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <h2 id="confirmTitle">Confirmar</h2>
            <p id="confirmDescription"></p>
            <div class="modal-actions">
                <button class="btn btn--secondary" id="confirmCancel">Cancelar</button>
                <button class="btn btn--danger" id="confirmOk">Confirmar</button>
            </div>
        </div>
    </div>
    <script src="../js/storage.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/caravanas.js"></script>
    <script src="../js/participantes.js"></script>
    <script src="../js/associacoes.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
