<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caravanas — Início</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="dashboard">
    <header class="page-header">
        <div class="page-header-inner">
            <span class="header-spacer" aria-hidden="true"></span>
            <h1 class="page-title">Caravanas</h1>
            <button class="btn btn--icon" data-logout aria-label="Sair"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-sign-out"/></svg></button>
        </div>
    </header>
    <main id="app" class="page">
        <section class="page-hero">
            <span class="eyebrow">Caravanas</span>
            <h2 id="greeting">Olá, responsável! O que deseja fazer hoje?</h2>
        </section>

        <section class="grid-2 shortcut-grid" aria-label="Atalhos">
            <article class="card card--clickable shortcut-card" data-shortcut="caravanas.html" tabindex="0" role="link" aria-label="Ver caravanas">
                <span class="shortcut-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-bus"/></svg></span>
                <h3>Caravanas</h3>
                <p class="page-subtitle">Ver e gerenciar caravanas</p>
            </article>
            <article class="card card--clickable shortcut-card" data-shortcut="participantes.html" tabindex="0" role="link" aria-label="Gerenciar participantes">
                <span class="shortcut-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-users"/></svg></span>
                <h3>Participantes</h3>
                <p class="page-subtitle">Gerenciar participantes</p>
            </article>
            <article class="card card--clickable shortcut-card" data-shortcut="caravana-form.html" tabindex="0" role="link" aria-label="Cadastrar nova caravana">
                <span class="shortcut-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-plus-circle"/></svg></span>
                <h3>Nova Caravana</h3>
                <p class="page-subtitle">Cadastrar uma nova caravana</p>
            </article>
            <article class="card card--clickable shortcut-card" data-shortcut="pesquisar-participante.html" tabindex="0" role="link" aria-label="Pesquisar participantes">
                <span class="shortcut-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-magnifying-glass"/></svg></span>
                <h3>Buscar</h3>
                <p class="page-subtitle">Pesquisar participantes</p>
            </article>
        </section>

        <section aria-labelledby="proximasTitle">
            <div class="section-header">
                <h2 id="proximasTitle">Próximas caravanas</h2>
                <span></span>
            </div>
            <div id="proximasCaravanas" class="caravana-list"></div>
        </section>
    </main>

    <nav class="bottom-nav" aria-label="Navegação principal">
        <div class="bottom-nav-inner">
            <button class="bottom-nav-item is-active" data-nav="dashboard.html" aria-current="page"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-house"/></svg></span><span>Início</span></button>
            <button class="bottom-nav-item" data-nav="caravanas.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-bus"/></svg></span><span>Caravanas</span></button>
            <button class="bottom-nav-item" data-nav="participantes.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-users"/></svg></span><span>Participantes</span></button>
            <button class="bottom-nav-item" data-nav="pesquisar-participante.html"><span class="bottom-nav-icon" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg#ph-dots-three"/></svg></span><span>Mais</span></button>
        </div>
    </nav>

    <div class="modal-overlay" id="confirmOverlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <h2 id="confirmTitle">Confirmar</h2>
            <p id="confirmDescription"></p>
            <div class="modal-actions">
                <button class="btn btn--secondary" id="confirmCancel">Cancelar</button>
                <button class="btn btn--danger" id="confirmOk">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/caravanas.js"></script>
    <script src="../js/participantes.js"></script>
    <script src="../js/associacoes.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
